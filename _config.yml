source:      .
destination: ./_site
includes:    ./_includes

# For a GitHub Pages *user* site (https://<username>.github.io) leave baseurl empty.
# For a *project* site (https://<username>.github.io/<repo>) set: baseurl: /<repo>
baseurl: ""
url: "https://chens676.github.io"

# Site metadata (used by SEO/sitemap)
title: "Clara (Chen) Shao"
description: "PhD Candidate in Computer Science at KIT — graph machine learning and foundation models."

plugins:
  - jekyll-sitemap

collections:
  projects:
    output: true

# Ignore old template files so they aren't built into the site
exclude:
  - _website_2014
  - __deploy.sh
  - __redirect_mit.html
  - __redirect_su.html
  - README.md
  - CV_academic.tex
